name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    if: ${{ github.event_name != 'pull_request' || (github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install --ignore-scripts

      - name: Run Semgrep
        run: python -m scanner.run_semgrep --target . --artifacts artifacts

      - name: Run Bandit
        run: python -m scanner.run_bandit --target . --artifacts artifacts

      - name: Run npm audit
        run: python -m scanner.run_npm_audit --target . --artifacts artifacts

      - name: Analyze findings
        run: |
          python -m agent.cli \
            --input artifacts/findings.json \
            --input artifacts/bandit-findings.json \
            --input artifacts/npm-audit-findings.json \
            --output-dir artifacts

      - name: Render reports
        run: |
          python -m reporting.cli \
            --input artifacts/findings.json \
            --input artifacts/bandit-findings.json \
            --input artifacts/npm-audit-findings.json \
            --analysis artifacts/analysis.json \
            --format all \
            --output-dir artifacts

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          retention-days: 30
          path: |
            artifacts/findings.json
            artifacts/bandit-findings.json
            artifacts/npm-audit-findings.json
            artifacts/analysis.json
            artifacts/security-report.json
            artifacts/security-report.md
            artifacts/security-report.xlsx
            artifacts/security-report.docx
            artifacts/security-report.pdf
            artifacts/manifest.json
          if-no-files-found: ignore

      - name: Post PR summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m reporting.summary \
            --report artifacts/security-report.json \
            --artifacts-url "$ARTIFACTS_URL" \
            --output pr-summary.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-summary.md
